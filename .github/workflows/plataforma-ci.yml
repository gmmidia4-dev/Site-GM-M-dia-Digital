name: Plataforma CI

on:
  push:
    branches: ['**']
    paths: ['plataforma/**']
  pull_request:
    paths: ['plataforma/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      NEXTAUTH_SECRET: ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plataforma/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
