services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reportia
      POSTGRES_PASSWORD: reportia
      POSTGRES_DB: reportia
    ports:
      - '5432:5432'
    volumes:
      - reportia_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reportia']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reportia:reportia@db:5432/reportia?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-troque-este-segredo-em-producao}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      DEMO_MODE: ${DEMO_MODE:-true}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGV2ZGU=}
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # SEED=true popula dados de demonstração na primeira subida
      SEED: ${SEED:-true}
    ports:
      - '3000:3000'

volumes:
  reportia_db:
